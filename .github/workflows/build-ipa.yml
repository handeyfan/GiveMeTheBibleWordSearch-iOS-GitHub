# Builds an UNSIGNED .ipa of Give Me the Bible Word Search on a GitHub macOS runner.
# Adapted from github.com/adro0303/ipa-builder (MIT) for a plain Xcode project (no Expo/CocoaPods needed).
# Runs automatically on every push, or by hand from the Actions tab ("Run workflow").
# Sign and install the result on your iPhone/iPad with Sideloadly or AltStore using your free Apple ID.
name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GiveMeTheBibleWordSearch.xcodeproj \
            -target GiveMeTheBibleWordSearch \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d "build/Release-iphoneos/Give Me the Bible Word Search.app"

      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/Give Me the Bible Word Search.app" out/Payload/
          cd out && zip -qry GiveMeTheBibleWordSearch-unsigned.ipa Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: GiveMeTheBibleWordSearch-unsigned-ipa
          path: out/GiveMeTheBibleWordSearch-unsigned.ipa
          retention-days: 30

      - name: Keep the build log if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
